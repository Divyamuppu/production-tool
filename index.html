<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>a-tom. Production Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F6FA; --panel:#F3F5F9; --ink:#0B1426; --text:#1C2536; --muted:#5E6878; --faint:#98A1B0;
  --line:#E1E5EC; --line-2:#ECEFF4; --blue:#2447F0; --blue-ink:#1A36C4; --blue-soft:#E8EDFF;
  --green:#1D7549; --green-soft:#E3F3EA; --amber:#9A6412; --amber-soft:#FCF1DC; --red:#C42A1C; --red-soft:#FDEBE9;
  --violet:#553A9E; --violet-soft:#EEE9FA; --lock:#98A1B0; --shadow:0 1px 2px rgba(11,20,38,.05),0 12px 32px rgba(11,20,38,.10);
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:68px}
.mark img{display:block;height:30px;width:auto}
.mark{display:flex;align-items:center;font-family:var(--sans);font-weight:500;font-size:28px;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.mark-sub{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-left:14px;border-left:1px solid var(--line)}
.me{margin-left:auto;margin-right:4px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.me img{width:28px;height:28px;border-radius:50%}
.me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.role-badge{font-family:var(--mono);font-size:11px;color:var(--blue);background:var(--blue-soft);padding:2px 6px;border-radius:4px}

/* general */
h1,h2,h3{color:var(--ink);margin:0}
.h-display{font-family:var(--serif);font-weight:500;font-size:clamp(30px,6vw,46px);line-height:1.05;letter-spacing:-.02em;font-variation-settings:"opsz" 144}
.lede{color:var(--muted);max-width:62ch;margin:8px 0 0}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:500;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--blue)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--blue);padding-left:0;padding-right:0}
.btn-danger{color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:15px;color:var(--text);width:100%}
textarea.inp{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;margin:16px 0;font-size:14px}
.banner.warn{border-color:var(--amber);background:var(--amber-soft)}
.banner.info{border-color:var(--blue);background:var(--blue-soft)}
.empty{padding:40px 0;color:var(--muted)}

/* home */
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:32px 0 20px;flex-wrap:wrap}
.proj-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.proj{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:18px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.proj:hover .proj-name{color:var(--blue)}
.proj-name{font-family:var(--serif);font-size:24px;color:var(--ink);font-weight:500}
.proj-meta{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.proj-count{text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted)}
.proj-count b{display:block;font-family:var(--serif);font-size:28px;color:var(--ink);font-weight:500}
.bar{height:4px;background:var(--line-2);border-radius:2px;overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--green)}

/* project header */
.back{display:inline-block;margin:20px 0 8px;font-size:14px;text-decoration:none}
.p-head{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end;padding-bottom:18px}
@media (max-width:640px){.p-head{grid-template-columns:1fr}}
.countdown{text-align:right}
@media (max-width:640px){.countdown{text-align:left}}
.countdown b{font-family:var(--serif);font-weight:500;font-size:52px;line-height:1;color:var(--ink);display:block;font-variation-settings:"opsz" 144}
.countdown span{font-size:13px;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--muted)}
.facts strong{color:var(--text);font-weight:500}
.now{margin:4px 0 0;font-size:15px}
.tabs{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto;scrollbar-width:none;max-width:100%;background:var(--surface)}
.tab{border:0;background:none;padding:9px 18px;font-weight:600;color:var(--muted);border-radius:999px;white-space:nowrap;font-size:14px}
.tab:hover{color:var(--blue)}
.tab[aria-selected="true"]{background:var(--blue);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:14px;margin:18px 0 0;overflow:hidden}
.stats>div{padding:16px 18px;border-left:1px solid var(--line)}
.stats>div:first-child{border-left:0}
.stats b{display:block;font-size:28px;font-weight:700;color:var(--ink);line-height:1.1}
.stats span{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats .red b{color:var(--red)} .stats .amber b{color:var(--amber)}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}.stats>div{border-left:0;border-top:1px solid var(--line)}.stats>div:nth-child(-n+2){border-top:0}.stats>div:nth-child(even){border-left:1px solid var(--line)}}

/* attention */
.attn{margin:12px 0 8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.attn-head{display:flex;gap:18px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line-2);font-size:13px;color:var(--muted)}
.attn-head b{font-family:var(--serif);font-size:20px;font-weight:500;margin-right:4px;color:var(--ink)}
.attn-head .red b{color:var(--red)} .attn-head .amber b{color:var(--amber)}
.attn-list{list-style:none;margin:0;padding:4px 0}
.attn-list button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px 14px;font-size:14px}
.attn-list button:hover{background:var(--surface-2)}
.why{font-size:12px;color:var(--muted)}
.clear-msg{padding:12px 14px;font-size:14px;color:var(--green)}

/* pipeline rail */
.rail{position:relative;margin:18px 0 60px}
.phase{display:grid;grid-template-columns:34px 1fr;gap:0 14px;position:relative}
.phase::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.phase:last-child::before{display:none}
.phase.is-cleared::before{background:var(--green)}
.node{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);position:relative;z-index:1}
.phase.is-active .node{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.phase.is-cleared .node{border-color:var(--green);background:var(--green);color:#fff}
.phase-body{padding-bottom:26px;min-width:0}
.phase-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:34px;padding-top:3px}
.phase-head h3{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.phase.is-locked .phase-head h3{color:var(--muted)}
.phase-count{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.stages{list-style:none;margin:8px 0 0;padding:8px;border-radius:14px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;padding:12px 14px}
.srow:hover{border-color:var(--blue)}
.srow.st-locked{background:#FAFBFC}
.srow.st-locked .sr-name{color:var(--muted)}
.sr-main{min-width:0;display:flex;flex-direction:column}
.sr-name{font-weight:500;color:var(--text)}
.sr-sub{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.sr-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--muted);white-space:nowrap}
.due{font-family:var(--mono);font-size:12px}
.due.late{color:var(--red);font-weight:600}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--line-2);color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-open{background:var(--line-2);color:var(--muted)} .p-progress{background:var(--blue-soft);color:var(--blue-ink)}
.p-awaiting{background:var(--amber-soft);color:var(--amber)} .p-done{background:var(--green-soft);color:var(--green)}
.p-overridden{background:var(--violet-soft);color:var(--violet)} .p-locked{background:transparent;color:var(--lock);border:1px dashed var(--lock)}
.p-review{background:var(--amber-soft);color:var(--amber)}
.glyph{width:20px;height:20px;display:block}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,19,37,.45);z-index:40}
.sheet{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-top{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-top h2{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.15;letter-spacing:-.01em}
.sheet-close{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;font-size:18px;line-height:1;flex:none}
.sheet-body{overflow-y:auto;padding:4px 18px 40px;flex:1}
.sec{padding:16px 0;border-bottom:1px solid var(--line-2)}
.sec:last-child{border-bottom:0}
.sec h4{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink)}
.desc{color:var(--muted);font-size:14px;margin:0}
.gate{border-radius:10px;padding:12px 14px;font-size:14px;margin-top:14px}
.gate.locked{background:var(--surface-2);border:1px dashed var(--lock)}
.gate.review{background:var(--amber-soft);border:1px solid var(--amber)}
.gate.override{background:var(--violet-soft);border:1px solid var(--violet)}
.gate.done{background:var(--green-soft);border:1px solid var(--green)}
.gate ul{margin:8px 0 0;padding:0;list-style:none}
.gate li button{border:0;background:none;padding:4px 0;color:var(--blue);text-align:left;font-size:14px}
.checks{list-style:none;margin:0;padding:0}
.check{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;padding:7px 0}
.tick{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;margin-top:1px}
.tick[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.tick[disabled]{cursor:not-allowed;opacity:.6}
.check-t{font-size:15px}
.check-by{display:block;font-size:12px;color:var(--muted)}
.x{border:0;background:none;color:var(--faint);font-size:16px;padding:0 4px}
.x:hover{color:var(--red)}
.actions{display:flex;flex-direction:column;gap:10px}
.hint{font-size:13px;color:var(--muted)}
.links{list-style:none;margin:0 0 10px;padding:0}
.links li{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14px;min-width:0}
.links a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comment{padding:8px 0;font-size:14px}
.comment .c-by{font-size:12px;color:var(--muted)}
.comment p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.hist{list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted)}
.hist li{padding:3px 0}

/* plate / log / team */
.block{margin:22px 0}
.block h3{font-family:var(--serif);font-weight:500;font-size:20px;margin-bottom:8px}
.log-day{margin:20px 0}
.log-day h3{font-family:var(--serif);font-weight:500;font-size:18px;margin-bottom:6px}
.log-e{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.log-e .mono{color:var(--muted);padding-top:2px}
.team-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line-2)}
.team-row b{font-weight:600;color:var(--ink)}
.deliv-edit{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:90vw;box-shadow:var(--shadow)}
.loading{padding:60px 0;color:var(--muted)}

.owners{display:flex;flex-wrap:wrap;gap:6px}
.own{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:500;text-align:left;line-height:1.25}
.own small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.own[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.own[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.own[disabled]{cursor:not-allowed;opacity:.7}
.check-due{display:block;font-size:12px;color:var(--muted)}
.check-due.late{color:var(--red);font-weight:600}
.role{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.role-head{display:flex;align-items:center;gap:8px}
.role-head .x{margin-left:auto}
.opts{list-style:none;margin:6px 0 8px;padding:0}
.opts li{display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px solid var(--line-2);font-size:14px}
.opt-name{flex:1;min-width:0}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.file{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;background:var(--surface)}
.file img,.file video{display:block;width:100%;height:110px;object-fit:cover;background:var(--panel)}
.file .doc{display:grid;place-items:center;height:110px;background:var(--panel);font-weight:700;letter-spacing:.1em;text-decoration:none;color:var(--blue)}
.file figcaption{padding:6px 8px;font-size:12px;min-width:0}
.file figcaption a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.file figcaption span{color:var(--muted)}
.file .x{position:absolute;top:4px;right:4px;background:var(--surface);border-radius:6px;line-height:1.2}
.upload{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.upload .btn{display:inline-block;cursor:pointer}
.dropzone.over{outline:2px dashed var(--blue);outline-offset:4px;border-radius:10px;background:var(--blue-soft)}

.bell-root{display:flex}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;color:var(--ink);padding:0;flex:none}
.bell:hover,.bell[aria-expanded="true"]{border-color:var(--blue);color:var(--blue)}
.bell .n{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:600;line-height:19px;text-align:center;border:2px solid var(--surface)}
.bell.ring svg{animation:ring .9s ease-in-out 2}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.bell.ring svg{animation:none}}
.notif{position:fixed;z-index:30;top:calc(74px + env(safe-area-inset-top,0px));right:max(16px,calc((100vw - 1040px)/2 + 16px));width:min(400px,calc(100vw - 32px));max-height:min(72vh,640px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.notif-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--line-2)}
.notif-head b{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--ink)}
.notif-list{list-style:none;margin:0;padding:6px 0;overflow-y:auto;flex:1}
.notif-grp{padding:10px 16px 4px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.notif-list button{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:start;width:100%;border:0;background:none;text-align:left;padding:9px 16px;font-size:14px}
.notif-list button:hover{background:var(--surface-2)}
.notif-list .dot{width:8px;height:8px;border-radius:50%;margin-top:7px}
.notif-list .nm{font-weight:500;color:var(--text)}
.notif-list .sub{display:block;font-size:12px;color:var(--muted)}
.notif-list .sub.red{color:var(--red);font-weight:600}
.notif-foot{border-top:1px solid var(--line-2);padding:12px 16px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.notif-foot .row{justify-content:space-between}
.notif-foot select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:13px}
.btn{white-space:nowrap}
.tab .cnt{display:inline-block;margin-left:6px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}
.home-grid{max-width:1280px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:36px;align-items:start}
@media (max-width:960px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.home-chat{position:sticky;top:calc(88px + env(safe-area-inset-top,0px));margin:32px 0 40px}
@media (max-width:960px){.home-chat{position:static;margin-top:0}}
.chat{border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;height:calc(100vh - 130px);min-height:420px;max-height:820px;overflow:hidden}
@media (max-width:960px){.chat{height:520px}}
.chat.tall{height:min(66vh,700px);margin:18px 0 60px}
.chat-head{display:flex;flex-direction:column;gap:2px;padding:14px 16px 10px;border-bottom:1px solid var(--line-2)}
.chat-head h3{font-family:var(--serif);font-weight:500;font-size:20px}
.chat-body{flex:1;overflow-y:auto;padding:4px 16px 10px}
.chat-day{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;margin:14px 0 4px}
.msg{padding:6px 0}
.msg-by{font-size:13px;font-weight:600;color:var(--ink)}
.msg.me .msg-by{color:var(--blue-ink)}
.msg-by .mono{font-weight:400;color:var(--muted);margin-left:8px;font-size:11px}
.msg p{margin:2px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.at{color:var(--blue-ink);background:var(--blue-soft);border-radius:4px;padding:0 3px;font-weight:500}
.at.me{background:var(--amber-soft);color:var(--amber)}
.chat-compose{position:relative;border-top:1px solid var(--line-2);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.chat-compose textarea{flex:1;min-width:0;min-height:42px;max-height:140px;resize:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.4;background:var(--surface)}
.chat-compose .btn{height:42px}
.mention-pop{position:absolute;left:12px;bottom:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;min-width:200px;z-index:5}
.mention-pop:empty{display:none}
.mention-pop button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;font-size:14px}
.mention-pop button:hover,.mention-pop button:first-child{background:var(--surface-2)}
.ack{position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100vw - 32px));max-height:82vh;display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.ack-top{display:flex;gap:14px;align-items:flex-start;padding:18px 18px 12px;border-bottom:1px solid var(--line-2)}
.ack-top h2{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.15}
.ack-top .desc{margin-top:4px}
.ack-bell{flex:none;width:44px;height:44px;border-radius:50%;background:var(--red-soft);color:var(--red);display:grid;place-items:center}
.ack .notif-list{max-height:none}
.ack-foot{border-top:1px solid var(--line-2);padding:12px 18px;display:flex;justify-content:flex-end;background:var(--surface-2)}
.c-launch{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;align-items:center;gap:8px;height:48px;padding:0 18px 0 16px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.c-launch:hover{background:var(--blue)}
.c-launch .n{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;line-height:20px;text-align:center}
.cdrawer{position:fixed;z-index:45;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cdrawer.enter{animation:slide .22s ease-out}
@media (prefers-reduced-motion:reduce){.cdrawer.enter{animation:none}}
.cdrawer.full{width:100%;border-left:0}
.c-rooms{width:300px;flex:none;border-right:1px solid var(--line);background:var(--surface-2);overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.c-rooms-head{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 10px 10px}
.c-room{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px}
.c-room:hover{background:var(--line-2)}
.c-room[aria-current="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.c-room-name{font-weight:600;color:var(--ink);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-room-last{grid-column:1/-1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-room .cnt{min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}
.c-main{flex:1;min-width:0;display:flex;flex-direction:column}
.c-head{display:flex;align-items:flex-start;gap:8px;padding:14px 14px 12px 18px;border-bottom:1px solid var(--line-2)}
.c-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.c-title h3{font-family:var(--serif);font-weight:500;font-size:24px;line-height:1.15;color:var(--ink)}
.c-select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-family:var(--serif);font-size:18px;font-weight:500;color:var(--ink);max-width:100%;cursor:pointer}
.cdrawer:not(.full) .c-title h3{display:none}
.cdrawer.full .c-select{display:none}
.c-icon{flex:none;width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:grid;place-items:center;font-size:20px;line-height:1;color:var(--ink);padding:0}
.c-icon:hover{border-color:var(--blue);color:var(--blue)}
.cdrawer .chat-body{flex:1;overflow-y:auto;padding:4px 18px 12px}
.cdrawer .chat-compose{display:block;padding:10px 14px}
.chat-col{max-width:760px;margin:0 auto;width:100%}
.c-row{position:relative;display:flex;gap:8px;align-items:flex-end}
.cdrawer.full .msg p{font-size:15px}
@media (max-width:720px){.c-rooms{display:none}.cdrawer.full .c-select{display:block}.cdrawer.full .c-title h3{display:none}}
body{background-color:#F4F1EA;background-image:radial-gradient(60vw 50vh at 8% 0%,rgba(36,71,240,.22),transparent 70%),radial-gradient(50vw 45vh at 95% 12%,rgba(85,58,158,.20),transparent 70%),radial-gradient(55vw 50vh at 85% 100%,rgba(154,100,18,.18),transparent 70%),radial-gradient(45vw 40vh at 0% 95%,rgba(29,117,73,.14),transparent 70%);background-attachment:fixed;min-height:100vh}
body .top{background:rgba(255,255,255,.55);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom-color:rgba(11,20,38,.08)}
body .top .wrap,body #app>.wrap{max-width:none;padding-left:clamp(16px,4vw,56px);padding-right:clamp(16px,4vw,56px)}
body.home .home-head{align-items:baseline;padding:48px 0 24px}
body.home .h-display{font-size:clamp(36px,5vw,64px)}
body.home .proj-list{border-top:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:16px;padding-bottom:96px}
body.home .proj{background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:rgba(255,255,255,.9)}
body.home .proj{border-radius:16px;border-width:1px;border-style:solid;padding:22px 24px;box-shadow:0 1px 2px rgba(11,20,38,.04);transition:box-shadow .15s,border-color .15s}
body.home .proj:hover{border-color:var(--blue);box-shadow:0 1px 2px rgba(11,20,38,.05),0 12px 28px rgba(11,20,38,.08)}
body.home .empty{background:rgba(255,255,255,.7);border:1px dashed rgba(11,20,38,.18);border-radius:16px;padding:48px 24px;text-align:center}
.hdr-new{flex:none;margin-left:6px}
.proj{cursor:pointer}
.proj-acts{grid-column:1/-1;display:flex;gap:18px;justify-content:flex-end;border-top:1px solid var(--line-2);padding-top:10px;margin-top:6px}
.proj-acts .btn{padding:4px 0;font-size:13px}
.msg-acts{display:inline-flex;gap:10px;margin-left:10px;opacity:0;transition:opacity .12s}
.msg:hover .msg-acts,.msg-acts:focus-within{opacity:1}
@media (hover:none){.msg-acts{opacity:1}}
.msg-acts button{border:0;background:none;padding:0;font-size:11px;font-weight:500;color:var(--muted)}
.msg-acts button:hover{color:var(--blue)}
.msg-acts button[data-act="msg-del"]:hover{color:var(--red)}
.np .h-display{font-size:clamp(36px,5vw,64px)}
.np-card{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:22px 24px;margin-top:22px;box-shadow:0 1px 2px rgba(11,20,38,.04)}
.np .deliv-edit{background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:18px 22px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))!important}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media (max-width:560px){.g4{grid-template-columns:1fr!important}}
.req{color:var(--red);font-weight:600}
input.invalid,textarea.invalid,.inp.invalid{border-color:var(--red)!important;background:var(--red-soft)!important}
.task-q{margin:0 0 14px;padding:12px 14px;background:var(--surface-2);border-radius:10px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:560px){.hdr-new{padding:9px 12px}.hdr-new span{display:none}.mark-sub{display:none}}

/* ---------- mobile ---------- */
@media (max-width:720px){
  .top .wrap{height:58px;gap:10px}
  .mark img{height:24px}
  .me span:not(.role-badge){display:none}
  .me .role-badge{display:none}
  .bell{width:40px;height:40px}
  .hdr-new{height:40px;padding:0 14px;font-size:18px;line-height:1}
  body .top .wrap,body #app>.wrap{padding-left:16px;padding-right:16px}
  .h-display,body.home .h-display,.np .h-display{font-size:34px}
  body.home .home-head{padding:24px 0 16px}
  .p-head{padding-bottom:12px}
  .countdown b{font-size:40px}
  .facts{gap:4px 14px}
  .tabs{display:flex;width:100%}
  .tab{padding:10px 14px}
  body.home .proj{padding:18px}
  .proj-name{font-size:21px}
  .proj-acts .btn{min-height:40px;padding:0 4px}
  .srow{grid-template-columns:22px minmax(0,1fr);padding:12px}
  .sr-meta{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 10px;white-space:normal}
  .phase{grid-template-columns:28px minmax(0,1fr);gap:0 10px}
  .node{width:28px;height:28px;font-size:12px}
  .phase::before{left:13px;top:28px}
  .stages{padding:6px}
  .np-card,.np .deliv-edit{padding:16px}
  .team-row{grid-template-columns:1fr;gap:6px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:720px), (pointer:coarse){
  .field input,.field select,.field textarea,.inp,.chat-compose textarea,.c-select,.notif-foot select{font-size:16px}
  .btn{min-height:44px}
  .btn-quiet{min-height:36px}
  .tick{width:32px;height:32px}
  .check{grid-template-columns:38px 1fr auto;padding:9px 0}
  .x{min-width:36px;min-height:36px}
  .c-icon{width:42px;height:42px}
  .msg-acts{opacity:1}
  .msg-acts button{padding:6px 2px;font-size:12px}
}
@media (max-width:720px){
  .sheet{width:100%}
  .sheet-top{padding:12px 14px 10px}
  .sheet-top h2{font-size:22px}
  .sheet-body{padding:4px 14px 40px}
  .cdrawer,.cdrawer.full{width:100%;border-left:0}
  .cdrawer [data-act="chat-full"]{display:none}
  .cdrawer .chat-body{padding:4px 14px 10px}
  .cdrawer .chat-compose{padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
  .c-head{padding:10px 10px 10px 14px}
  .c-launch{right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));height:52px;padding:0 18px}
  .notif{left:8px;right:8px;width:auto;top:calc(64px + env(safe-area-inset-top,0px));max-height:calc(100dvh - 80px)}
  .notif-list button{padding:12px 14px}
  .ack{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:88dvh;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .ack-top{padding:16px 16px 10px}
  .ack-top h2{font-size:22px}
  .ack-foot{padding:10px 14px}
  .ack-foot .btn{flex:1}
  .ack-foot .row{flex:1;flex-wrap:nowrap}
  .banner{padding:12px}
  .banner .row .inp{max-width:none!important;flex:1 1 100%}
}
@supports (height:100dvh){.chat{height:calc(100dvh - 130px)}}

.proj-count small,.proj-count span{white-space:nowrap}
body.home .proj{grid-template-columns:minmax(0,1fr) auto!important}
.home-head .mono{white-space:nowrap}
.role-badge{max-width:none!important;overflow:visible!important;text-overflow:clip!important;white-space:nowrap}

  costume: { name: "Costume design", phase: 2, owners: [], anchor: "ppm", off: -1,
    desc: "Strict. Every item has its own deadline and turns red the moment it slips. Nothing is left to be figured out at the fitting.",

  ad_delivery: { name: "Delivery", phase: 6, owners: [], anchor: "delivery", off: 0,
    desc: "Files out the door.",
    items: ["Exports for every platform spec", "Files delivered and receipt confirmed"] }
};

function addDays(ymd, n) {
  if (!ymd) return "";
  var p = ymd.split("-").map(Number);
  var d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
  return d.toISOString().slice(0, 10);
}

function anchorDate(p, d, a) {
  if (a === "ppm") return p.ppmDate;
  if (a === "shoot") return p.shootDate;
  if (!d) return "";
  if (a === "firstCut") return d.firstCut;
  if (a === "finalCut") return d.finalCut;
  if (a === "delivery") return d.delivery;
  return "";
}

function computeDue(p, stage) {
  var d = null;
  (p.deliverables || []).forEach(function (x) { if (x.id === stage.deliv) d = x; });
  var base = anchorDate(p, d, stage.anchor);
  return base ? addDays(base, stage.off || 0) : "";
}

/* Builds every stage doc for a project. Returns [{id, data}] */
function buildStages(p, pid) {
  var out = [], order = 0;
  var films = p.deliverables.filter(function (d) { return d.type === "film"; });
  var reels = p.deliverables.filter(function (d) { return d.type === "reel"; });
  function sid(d, k) { return (d ? d.id : "shared") + "--" + k; }
  function mk(k, d, after) {
    var t = TPL[k];
    var s = {
      pid: pid, key: k, deliv: d ? d.id : null, phase: t.phase, order: order++,
      name: t.name, desc: t.desc, after: after, owners: t.owners.slice(),
      anchor: t.anchor, off: t.off, dueAuto: true, due: "",
      items: t.items.map(function (x, i) { var o = typeof x === "string" ? { t: x } : x; var it = { id: "c" + i, t: o.t }; if (o.anchor) { it.anchor = o.anchor; it.off = o.off || 0; } return it; }),
      roles: t.roles ? {} : null, rolesMin: t.roles || 0, files: {},
      ticks: {}, clientReq: !!t.client, client: null, links: {}, comments: {},
      ownerDoneAt: 0, ownerDoneBy: null, reopenedAt: 0, flaggedAt: 0, flagReason: ""
    };
    s.due = computeDue(p, s);
    s.items.forEach(function (it) { if (it.anchor) it.due = computeDue(p, { deliv: s.deliv, anchor: it.anchor, off: it.off }); });
    out.push({ id: sid(d, k), data: s });
    return sid(d, k);
  }
  var locks = [];
  films.forEach(function (f) { locks.push(mk("script_lock", f, [])); });
  reels.forEach(function (r) { locks.push(mk("ad_scripts", r, [])); });
  var prePpm = [];
  films.forEach(function (f) {
    var sp = mk("screenplay", f, [sid(f, "script_lock")]);
    prePpm.push(mk("sensitivity", f, [sp]));
    prePpm.push(mk("storyboard", f, [sp]));
  });
  reels.forEach(function (r) { prePpm.push(mk("ad_shot_plan", r, [sid(r, "ad_scripts")])); });
  var ref = mk("references", null, locks.slice());
  prePpm.push(ref);
  prePpm.push(mk("dop_look", null, [ref]));
  var cast = mk("casting", null, locks.slice());
  prePpm.push(cast);
  var consent = mk("consent", null, [cast]);
  prePpm.push(mk("locations", null, locks.slice()));
  prePpm.push(mk("art", null, [ref]));
  prePpm.push(mk("costume", null, locks.slice()));
  prePpm.push(mk("app_assets", null, locks.slice()));
  var deck = mk("ppm_deck", null, prePpm);
  var ppm = mk("ppm", null, [deck]);
  var cs = mk("callsheet", null, [ppm]);
  var cst = mk("costume_set", null, [ppm]);
  var shoot = mk("shoot", null, [cs, consent, cst]);
  films.forEach(function (f) {
    var fc = mk("first_cut", f, [shoot]);
    var fb = mk("feedback", f, [fc]);
    var fin = mk("finishing", f, [fb]);
    var fl = mk("final_cut", f, [fin]);
    mk("delivery", f, [fl]);
  });
  reels.forEach(function (r) {
    var e = mk("ad_edit", r, [shoot]);
    mk("ad_delivery", r, [e]);
  });
  return out;
}

if (typeof module !== "undefined") module.exports = { buildStages: buildStages, PHASES: PHASES, TPL: TPL };
/* ===== app ===== */
var S = {
  db: null, user: null, me: { id: null, name: "", avatarUrl: "" }, isAdmin: false, canWrite: true,
  ready: false, fatal: null,
  team: {}, projects: {}, stages: {}, signoffs: {}, log: [],
  names: {}, homeStats: {}, route: { v: "home" }, ui: {}, newProj: null
};
var subs = { base: [], proj: [] };
var curPid = null;

/* ---------- utils ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtDate(ymd) { if (!ymd) return "No date"; var p = ymd.split("-").map(Number); var d = new Date(p[0], p[1] - 1, p[2]); return DOW[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()]; }
function fmtTime(ms) { if (!ms) return ""; var d = new Date(ms); return d.getDate() + " " + MON[d.getMonth()] + ", " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function hhmm(ms) { var d = new Date(ms); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function daysBetween(a, b) { var pa = a.split("-").map(Number), pb = b.split("-").map(Number); return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000); }
function assetUrl(a) { return S.assets && S.assets.url ? S.assets.url(a) : "/_blob/" + a; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "x"; }
var toastT;
function toast(msg) { var el = document.getElementById("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 3800); }
function errMsg(e) {
  var c = e && e.code;
  if (c === "invalid_argument") return "That change wasn't saved. You may not have permission for it.";
  if (c === "quota_exceeded") return "Storage is full. Archive old productions to free space.";
  if (c === "resource_exhausted") return "Too many changes at once. Wait a moment and try again.";
  if (c === "revoked") return "Your access to this page changed. Reload to continue.";
  return "Couldn't save. Check your connection and try again.";
}

/* ---------- writes ---------- */
var queues = {};
function q(path, fn) {
  var p = (queues[path] || Promise.resolve()).then(fn).catch(function (e) { toast(errMsg(e)); throw e; });
  queues[path] = p.catch(function () {});
  return p;
}
function upd(path, data) { return q(path, function () { return S.db.doc(path).update(data); }); }
function put(path, data) { return q(path, function () { return S.db.doc(path).set(data); }); }
function stagePath(pid, sid) { return "projects/" + pid + "/stages/" + sid; }
function logIt(pid, text) {
  var day = today(), path = "projects/" + pid + "/log/" + day, id = "e" + uid();
  var entry = { at: Date.now(), by: S.me.id, text: text }, patch = { entries: {} };
  patch.entries[id] = entry;
  return q(path, function () {
    return S.db.doc(path).update(patch).catch(function (e) {
      if (e && e.code === "invalid_argument") return S.db.doc(path).set({ day: day, entries: patch.entries });
      throw e;
    });
  }).catch(function () {});
}

/* ---------- people ---------- */
function members() { return Object.keys(S.team).map(function (k) { return S.team[k]; }).sort(function (a, b) { return (a.order || 0) - (b.order || 0); }); }
function myMember() { if (!S.me.id) return null; return members().filter(function (m) { return m.userId === S.me.id; })[0] || null; }
function memberName(mid) { return (S.team[mid] && S.team[mid].name) || "Unassigned"; }
var pendingIds = {};
function who(u) {
  if (!u) return "Someone";
  var m = members().filter(function (x) { return x.userId === u; })[0];
  if (m) return m.name;
  if (S.names[u] !== undefined) return S.names[u] || "Someone";
  pendingIds[u] = 1;
  return "Someone";
}
var resolving = false;
function resolveNames() {
  var ids = Object.keys(pendingIds); pendingIds = {};
  if (!ids.length || !S.user || resolving) return;
  resolving = true;
  S.user.profiles(ids).then(function (ps) {
    var changed = false;
    ids.forEach(function (i) { var n = (ps[i] && ps[i].name) || ""; if (S.names[i] !== n) { S.names[i] = n; changed = true; } });
    resolving = false;
    if (changed) render();
  }).catch(function () { resolving = false; });
}
function ownersOf(s) { return s && s.owners && s.owners.length ? s.owners : (s && s.owner ? [s.owner] : []); }
function ownerNames(s) { var o = ownersOf(s); return o.length ? o.map(memberName).join(" & ") : "Unassigned"; }
function isOwnerOf(s) { var m = myMember(); return !!(m && s && ownersOf(s).indexOf(m.id) >= 0); }
function canAct(s) { return S.canWrite && (S.isAdmin || isOwnerOf(s)); }

/* ---------- state ---------- */
function delivName(pid, d) { var p = S.projects[pid]; if (!d) return "Shared"; var x = ((p && p.deliverables) || []).filter(function (y) { return y.id === d; })[0]; return x ? x.name : d; }
function label(s) { return s.name + (s.deliv ? " (" + delivName(s.pid, s.deliv) + ")" : ""); }
function stageList() { return Object.keys(S.stages).map(function (k) { return S.stages[k]; }).sort(function (a, b) { return a.phase - b.phase || a.order - b.order; }); }
function computeStates(stages, signoffs) {
  var st = {}, t = today();
  Object.keys(stages).forEach(function (id) {
    var s = stages[id], so = signoffs[id], inval = Math.max(s.reopenedAt || 0, s.flaggedAt || 0);
    st[id] = { done: !!(so && so.at > inval), so: so, inval: inval };
  });
  Object.keys(stages).forEach(function (id) {
    var s = stages[id], x = st[id];
    x.blockers = (s.after || []).filter(function (a) { return stages[a] && !st[a].done; });
    x.locked = !x.done && x.blockers.length > 0;
    var items = s.items || [], ticks = s.ticks || {};
    x.total = items.length;
    x.ticked = items.filter(function (i) { return ticks[i.id]; }).length;
    x.complete = x.ticked === x.total;
    x.clientOk = !s.clientReq || !!(s.client && s.client.who);
    x.lateItems = items.filter(function (i) { return !ticks[i.id] && i.due && i.due < t; }).length;
    if (s.rolesMin) {
      var rs = Object.keys(s.roles || {}).map(function (k) { return s.roles[k]; }).filter(Boolean);
      x.rolesTotal = rs.length;
      x.rolesShort = rs.filter(function (r) { return optCount(r) < s.rolesMin; }).length;
      x.rolesOk = rs.length > 0 && x.rolesShort === 0;
    } else x.rolesOk = true;
    x.flagged = !!(s.flaggedAt && s.flaggedAt > (s.reopenedAt || 0) && x.so && x.so.at <= s.flaggedAt);
    x.ownerDone = !!(s.ownerDoneAt && s.ownerDoneAt > x.inval);
    x.status = x.done ? (x.so.type === "override" ? "overridden" : "done") : x.locked ? "locked" : x.flagged ? "review" : x.ownerDone ? "awaiting" : x.ticked > 0 ? "progress" : "open";
    x.overdue = !x.done && !!s.due && s.due < t;
  });
  return st;
}
function optCount(r) { var o = r.options || {}; return Object.keys(o).filter(function (k) { return o[k]; }).length; }
var STATUS_TXT = { open: "Not started", progress: "In progress", awaiting: "Waiting for sign-off", done: "Signed off", overridden: "Overridden", locked: "Locked", review: "Needs review" };
function glyph(status) {
  var c = { open: "var(--faint)", progress: "var(--blue)", awaiting: "var(--amber)", done: "var(--green)", overridden: "var(--violet)", locked: "var(--lock)", review: "var(--amber)" }[status];
  if (status === "locked") return '<svg class="glyph" viewBox="0 0 20 20" aria-hidden="true"><rect x="4.5" y="9" width="11" height="8" rx="1.5" fill="none" stroke="' + c + '" stroke-width="1.6"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9" fill="none" stroke="' + c + '" stroke-width="1.6"/></svg>';
  if (status === "done" || status === "overridden") return '<svg class="glyph" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="' + c + '"/><path d="M6 10.3l2.6 2.6L14 7.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if (status === "review") return '<svg class="glyph" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l8 14H2z" fill="none" stroke="' + c + '" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 8v4M10 14.2v.3" stroke="' + c + '" stroke-width="1.8" stroke-linecap="round"/></svg>';
  if (status === "awaiting") return '<svg class="glyph" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="' + c + '" stroke-width="1.8"/><circle cx="10" cy="10" r="3.5" fill="' + c + '"/></svg>';
  if (status === "progress") return '<svg class="glyph" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="' + c + '" stroke-width="1.8"/><path d="M10 2a8 8 0 0 1 0 16z" fill="' + c + '"/></svg>';
  return '<svg class="glyph" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="' + c + '" stroke-width="1.8"/></svg>';
}
function lastDelivery(p) {
  var ds = (p.deliverables || []).map(function (d) { return d.type === "reel" ? d.delivery : d.finalCut; }).filter(Boolean).sort();
  return ds[ds.length - 1] || "";
}

/* ---------- routing ---------- */
function parseHash() {
  var h = (location.hash || "").replace(/^#\/?/, "").split("/");
  if (h[0] === "p" && h[1]) return { v: "project", pid: decodeURIComponent(h[1]), tab: h[2] || "pipeline", stage: h[3] ? decodeURIComponent(h[3]) : null };
  if (h[0] === "new") return { v: "new" };
  return { v: "home" };
}
function go(r) {
  var h = "#/";
  if (r.v === "project") h = "#/p/" + encodeURIComponent(r.pid) + "/" + (r.tab || "pipeline") + (r.stage ? "/" + encodeURIComponent(r.stage) : "");
  if (r.v === "new") h = "#/new";
  if (location.hash !== h) location.hash = h; else onRoute();
}
function onRoute() {
  var r = parseHash(), prevFilter = S.route.filter, old = S.route;
  if (r.v === "project" && r.tab === "chat") { r.tab = "pipeline"; S.chatOpen = true; S.chatRoom = r.pid; history.replaceState(null, "", "#/p/" + encodeURIComponent(r.pid) + "/pipeline"); }
  if (r.v === "project" && S.route.v === "project" && S.route.pid === r.pid) r.filter = prevFilter;
  S.route = r;
  if (r.v === "project") openProject(r.pid); else closeProject();
  if (r.v === "home") loadHomeStats();
  if (r.v === "new" && !S.newProj) S.newProj = blankProj();
  render();
  if (old.v !== r.v || old.pid !== r.pid || old.tab !== r.tab) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", onRoute);

/* ---------- subscriptions ---------- */
function openProject(pid) {
  if (curPid === pid || !S.db) return;
  closeProject();
  curPid = pid; S.stages = {}; S.signoffs = {}; S.log = []; S.ui = {}; ensureChat(pid);
  subs.proj.push(S.db.collection("projects/" + pid + "/stages").onSnapshot(function (snap) {
    var o = {}; snap.docs.forEach(function (d) { o[d.id] = Object.assign({ id: d.id }, d.data()); }); S.stages = o; S.stagesLoaded = true; render(); alertsSoon();
  }, function (e) { toast(errMsg(e)); }));
  subs.proj.push(S.db.collection("signoffs").where("pid", "==", pid).onSnapshot(function (snap) {
    var o = {}; snap.docs.forEach(function (d) { var x = d.data(); o[x.sid] = x; }); S.signoffs = o; render(); alertsSoon();
  }, function (e) { toast(errMsg(e)); }));
  subs.proj.push(S.db.collection("projects/" + pid + "/log").orderBy("day", "desc").limit(14).onSnapshot(function (snap) {
    S.log = snap.docs.map(function (d) { return d.data(); }); render();
  }, function () {}));
}
function closeProject() { subs.proj.forEach(function (u) { try { u(); } catch (e) {} }); subs.proj = []; curPid = null; S.stagesLoaded = false; }
function loadHomeStats() {
  if (!S.db) return;
  Object.keys(S.projects).forEach(function (pid) {
    Promise.all([S.db.collection("projects/" + pid + "/stages").get(), S.db.collection("signoffs").where("pid", "==", pid).get()]).then(function (r) {
      var st = {}, so = {};
      r[0].docs.forEach(function (d) { st[d.id] = Object.assign({ id: d.id }, d.data()); });
      r[1].docs.forEach(function (d) { var x = d.data(); so[x.sid] = x; });
      var cs = computeStates(st, so), ids = Object.keys(cs);
      S.homeStats[pid] = {
        total: ids.length, done: ids.filter(function (i) { return cs[i].done; }).length,
        late: ids.filter(function (i) { return cs[i].overdue; }).length,
        waiting: ids.filter(function (i) { return cs[i].status === "awaiting" || cs[i].status === "review"; }).length

      render();
    }).catch(function () {});
  });
}

/* ---------- render ---------- */
function captureInputs() {
  var keep = {}, a = document.activeElement, focus = null;
  document.querySelectorAll("[data-keep]").forEach(function (el) { if (S.freshSheet && el.closest("#sheet-root")) return; keep[el.getAttribute("data-keep")] = el.value; });
  S.freshSheet = false;
  if (a && a.getAttribute && a.getAttribute("data-keep")) focus = { k: a.getAttribute("data-keep"), s: a.selectionStart, e: a.selectionEnd };
  var sb = document.querySelector(".sheet-body");
  return { keep: keep, focus: focus, sheetScroll: sb ? sb.scrollTop : 0 };
}
function restoreInputs(c) {
  document.querySelectorAll("[data-keep]").forEach(function (el) { var k = el.getAttribute("data-keep"); if (c.keep[k] !== undefined) el.value = c.keep[k]; });
  if (c.focus) { var el = document.querySelector('[data-keep="' + c.focus.k + '"]'); if (el) { el.focus(); try { el.setSelectionRange(c.focus.s, c.focus.e); } catch (e) {} } }
  var sb = document.querySelector(".sheet-body"); if (sb) sb.scrollTop = c.sheetScroll;
}
function render() {
  var c = captureInputs(), cc = captureChat();
  document.getElementById("me").innerHTML = renderMe();
  document.getElementById("bell-root").innerHTML = renderBell();
  document.getElementById("hdr-act").innerHTML = S.ready && S.canWrite && S.route.v !== "new" ? '<button class="btn btn-primary hdr-new" data-act="new">+<span> New production</span></button>' : "";
  document.body.classList.toggle("home", S.route.v === "home");
  document.getElementById("chat-root").innerHTML = renderChatDrawer() + renderLauncher();
  document.getElementById("notif-root").innerHTML = S.ready ? (S.mustAck && !S.task ? renderAck() : "") + (S.notifOpen ? renderNotif() : "") + renderTask() : "";
  document.title = (S.alerts.length ? "(" + S.alerts.length + ") " : "") + "a-tom. Production Pipeline";
  var app = document.getElementById("app"), sheet = document.getElementById("sheet-root");
  if (S.fatal) { app.innerHTML = '<div class="wrap"><div class="banner warn">' + esc(S.fatal) + "</div></div>"; sheet.innerHTML = ""; return; }
  if (!S.ready) { app.innerHTML = '<div class="wrap loading">Loading productions…</div>'; return; }
  var r = S.route;
  if (r.v === "home") app.innerHTML = renderHome();
  else if (r.v === "new") app.innerHTML = renderNew();
  else app.innerHTML = renderProject();
  sheet.innerHTML = r.v === "project" && r.stage && S.stages[r.stage] ? renderSheet(S.stages[r.stage]) : "";
  document.body.style.overflow = sheet.innerHTML || (S.chatOpen && S.chatFull) ? "hidden" : "";
  restoreInputs(c); restoreChat(cc);
  resolveNames();
}
function renderMe() {
  if (!S.ready) return "";
  var m = myMember(), n = m ? m.name : (S.me.name || "");
  return (S.me.avatarUrl ? '<img alt="" src="' + esc(S.me.avatarUrl) + '">' : "") + "<span>" + esc(n || "Signed in") + "</span>" + (S.isAdmin ? '<span class="role-badge">Approver</span>' : "");
}
function identityBanner() {
  if (myMember()) return emailBanner();
  if (!S.me.id || !S.canWrite) return "";
  var free = members().filter(function (m) { return !m.userId; });
  return '<div class="banner info"><strong>Which one are you?</strong> Pick your name so your ticks and sign-offs are credited to you.<div class="row" style="margin-top:10px">' +
    free.map(function (m) { return '<button class="btn" data-act="claim" data-mid="' + esc(m.id) + '">' + esc(m.name) + "</button>"; }).join("") +
    '<input class="inp" style="max-width:180px" placeholder="Or add your name" data-keep="claim-new"><button class="btn" data-act="claim-new">Add me</button></div></div>';
}

/* home */
function renderHomeMain() {
  var ps = Object.keys(S.projects).map(function (k) { return S.projects[k]; }).filter(function (p) { return !p.archived; })
    .sort(function (a, b) { return (lastDelivery(a) || "9") < (lastDelivery(b) || "9") ? -1 : 1; });
  var h = '<div>' + roBanner() + (myMember() ? "" : identityBanner()) + '<div class="home-head"><h1 class="h-display">Productions</h1>' + (ps.length ? '<span class="mono muted">' + ps.length + " active</span>" : "") + (ps.length && S.isAdmin ? '<button class="btn btn-quiet" data-act="import-data" style="margin-left:auto">Import data</button>' : "") + "</div>";
  if (!ps.length) return h + '<div class="empty">No productions yet. Use <strong>New production</strong> at the top right to start one.' + (S.canWrite ? '<div style="margin-top:14px"><button class="btn" data-act="import-data">Import data from old version</button></div>' : '') + '</div></div>';
  h += '<div class="proj-list">';
  ps.forEach(function (p) {
    var st = S.homeStats[p.id], ld = lastDelivery(p), dl = ld ? daysBetween(today(), ld) : null;
    h += '<div class="proj" role="link" tabindex="0" data-act="goproj" data-pid="' + esc(p.id) + '"><div><div class="proj-name">' + esc(p.name) + '</div></div>' +
      '<div class="proj-count">' + (st ? "<b>" + st.done + "/" + st.total + "</b>signed off" : "") + "</div>" +
      (st ? '<div class="bar"><i style="width:' + (st.total ? Math.round(100 * st.done / st.total) : 0) + '%"></i></div>' : "") +
      '<div class="proj-meta"><span>' + esc(p.client || "") + "</span><span>PPM " + esc(fmtDate(p.ppmDate)) + "</span><span>Shoot " + esc(fmtDate(p.shootDate)) + "</span>" +

/* new production */
function blankProj() { return { name: "", client: "", ppm: "", shoot: "", delivs: [{ id: "d" + uid(), type: "film", name: "Film One", firstCut: "", finalCut: "", delivery: "" }] }; }

  var n = S.newProj; if (!n) return;
  function v(k) { var el = document.querySelector('[data-keep="' + k + '"]'); return el ? el.value : undefined; }
  ["name", "client", "ppm", "shoot"].forEach(function (k) { var x = v("np-" + k); if (x !== undefined) n[k] = x; });
  n.delivs.forEach(function (d) { ["name", "firstCut", "finalCut", "delivery"].forEach(function (k) { var x = v("nd-" + d.id + "-" + k); if (x !== undefined) d[k] = x; }); });
}

  n.delivs.forEach(function (d) {
    h += '<div class="deliv-edit"><div class="row" style="justify-content:space-between"><strong>' + (d.type === "film" ? "Film" : "Set of ads") + "</strong>" +
      (n.delivs.length > 1 ? '<button class="btn btn-quiet btn-danger" data-act="np-rm" data-id="' + d.id + '">Remove</button>' : "") + '</div><div class="grid2 g4" style="margin-top:8px">' +

/* project */
function renderProject() {
  var r = S.route, p = S.projects[r.pid];
  if (!p) return '<div class="wrap"><a href="#/" class="back">Back to productions</a><div class="empty">' + (S.ready ? "This production doesn't exist or you can't see it." : "Loading…") + "</div></div>";
  var st = computeStates(S.stages, S.signoffs), list = stageList(), t = today();
  var ld = lastDelivery(p), dl = ld ? daysBetween(t, ld) : null;
  var notDone = list.filter(function (s) { return !st[s.id].done; });
  var phaseNow = notDone.length ? Math.min.apply(null, notDone.map(function (s) { return s.phase; })) : null;
  var next = notDone.filter(function (s) { return !st[s.id].locked && s.due; }).sort(function (a, b) { return a.due < b.due ? -1 : 1; })[0];
  var h = '<div class="wrap"><a href="#/" class="back">All productions</a>' + roBanner() + identityBanner() +
    '<div class="p-head"><div><h1 class="h-display">' + esc(p.name) + "</h1>" +
    '<div class="facts"><span>Client <strong>' + esc(p.client || "") + '</strong></span><span>PPM <strong>' + esc(fmtDate(p.ppmDate)) + '</strong></span><span>Shoot <strong>' + esc(fmtDate(p.shootDate)) + "</strong></span>" +
    (p.deliverables || []).map(function (d) { return "<span>" + esc(d.name) + " <strong>" + esc(fmtDate(d.type === "reel" ? d.delivery : d.finalCut)) + "</strong></span>"; }).join("") + "</div>" +
    (S.stagesLoaded ? '<p class="now">' + (phaseNow === null ? "Every stage is signed off." : "Now in <strong>" + esc(PHASES[phaseNow]) + "</strong>." + (next ? " Next due: " + esc(label(next)) + ", " + esc(fmtDate(next.due)) + ", owned by " + esc(ownerNames(next)) + "." : "")) + "</p>" : "") +
    "</div>" + (dl !== null ? '<div class="countdown"><b>' + Math.max(dl, 0) + "</b><span>days to final delivery</span></div>" : "") + "</div>";
  var tabs = [["pipeline", "Pipeline"], ["plate", "My plate"], ["log", "Activity"], ["team", "Team"], ["settings", "Dates and settings"]];
  h += '<div class="tabs" role="tablist">' + tabs.map(function (x) { return '<button class="tab" role="tab" aria-selected="' + (r.tab === x[0]) + '" data-act="tab" data-tab="' + x[0] + '">' + x[1] + "</button>"; }).join("") + "</div>";
  if (!S.stagesLoaded) return h + '<div class="loading">Loading pipeline…</div></div>';
  if (r.tab === "plate") h += renderPlate(st, list);
  else if (r.tab === "log") h += renderLog();
  else if (r.tab === "team") h += renderTeam(st, list);
  else if (r.tab === "settings") h += renderSettings(p);
  else h += renderPipeline(p, st, list);
  return h + "</div>";
}
function stageRow(s, x, extra) {
  return '<button class="srow st-' + x.status + '" data-act="open" data-sid="' + esc(s.id) + '">' + glyph(x.status) +
    '<span class="sr-main"><span class="sr-name">' + esc(s.name) + '</span><span class="sr-sub"><span class="tag">' + esc(delivName(s.pid, s.deliv)) + "</span><span>" + esc(STATUS_TXT[x.status]) + "</span>" +
    (x.status !== "locked" && x.total ? "<span>" + x.ticked + "/" + x.total + "</span>" : "") + (!x.done && x.lateItems ? '<span style="color:var(--red)">' + x.lateItems + " item" + (x.lateItems > 1 ? "s" : "") + " late</span>" : "") + (extra ? "<span>" + extra + "</span>" : "") + "</span></span>" +
    '<span class="sr-meta"><span class="due' + (x.overdue ? " late" : "") + '">' + esc(fmtDate(s.due)) + "</span><span>" + esc(ownerNames(s)) + "</span></span></button>";
}
function renderPipeline(p, st, list) {
  var f = S.route.filter || "all";
  var shown = list.filter(function (s) { return f === "all" || (f === "shared" ? !s.deliv : (!s.deliv || s.deliv === f)); });
  var h = '<div class="chips">' + [["all", "Everything"]].concat((p.deliverables || []).map(function (d) { return [d.id, d.name]; })).concat([["shared", "Shared only"]])
    .map(function (x) { return '<button class="chip" aria-pressed="' + (f === x[0]) + '" data-act="filter" data-f="' + esc(x[0]) + '">' + esc(x[1]) + "</button>"; }).join("") + "</div>";
  // attention
  var late = shown.filter(function (s) { return st[s.id].overdue; });
  var waiting = shown.filter(function (s) { return st[s.id].status === "awaiting"; });
  var review = shown.filter(function (s) { return st[s.id].status === "review"; });
  var itemLate = shown.filter(function (s) { var x = st[s.id]; return !x.done && !x.overdue && x.lateItems > 0; });
  var doneN = shown.filter(function (s) { return st[s.id].done; }).length;
  h += '<div class="stats"><div><b>' + doneN + "/" + shown.length + '</b><span>Signed off</span></div><div class="' + (late.length ? "red" : "") + '"><b>' + late.length + '</b><span>Stages overdue</span></div><div class="' + (itemLate.length ? "red" : "") + '"><b>' + itemLate.reduce(function (a, s) { return a + st[s.id].lateItems; }, 0) + '</b><span>Items late</span></div><div class="' + (waiting.length ? "amber" : "") + '"><b>' + waiting.length + '</b><span>Waiting for sign-off</span></div><div class="' + (review.length ? "amber" : "") + '"><b>' + review.length + "</b><span>Need review</span></div></div>";
  h += '<div class="attn">';
  var items = [];
  late.forEach(function (s) { var x = st[s.id]; items.push([s, x, x.locked ? "Past deadline and still locked: " + x.blockers.map(function (b) { return S.stages[b].name + (S.stages[b].deliv ? " (" + delivName(s.pid, S.stages[b].deliv) + ")" : ""); }).slice(0, 2).join(", ") + (x.blockers.length > 2 ? " and " + (x.blockers.length - 2) + " more" : "") + " not signed off" : "Due " + fmtDate(s.due) + ", owned by " + ownerNames(s)]); });
  itemLate.forEach(function (s) { var x = st[s.id]; items.push([s, x, x.lateItems + " checklist item" + (x.lateItems > 1 ? "s" : "") + " past deadline, owned by " + ownerNames(s)]); });
  waiting.forEach(function (s) { if (!st[s.id].overdue) items.push([s, st[s.id], "Marked complete. Needs the approver's sign-off."]); });
  review.forEach(function (s) { if (!st[s.id].overdue) items.push([s, st[s.id], s.flagReason || "Something upstream changed."]); });
  if (items.length) h += '<ul class="attn-list">' + items.slice(0, 8).map(function (it) {
    return '<li><button data-act="open" data-sid="' + esc(it[0].id) + '">' + glyph(it[1].status) + '<span><span class="sr-name">' + esc(label(it[0])) + '</span><br><span class="why">' + esc(it[2]) + '</span></span><span class="due' + (it[1].overdue ? " late" : "") + '">' + esc(fmtDate(it[0].due)) + "</span></button></li>";
  }).join("") + "</ul>" + (items.length > 8 ? '<div class="why" style="padding:0 14px 10px">and ' + (items.length - 8) + " more below</div>" : "");
  else h += '<div class="clear-msg">Nothing overdue or waiting. Keep it that way.</div>';
  h += "</div>";
  // rail
  h += '<div class="rail">';
  PHASES.forEach(function (ph, i) {
    var ss = shown.filter(function (s) { return s.phase === i; });
    if (!ss.length) return;
    var done = ss.filter(function (s) { return st[s.id].done; }).length, lockedAll = ss.every(function (s) { return st[s.id].locked; });
    var cls = done === ss.length ? "is-cleared" : lockedAll ? "is-locked" : "is-active";
    h += '<section class="phase ' + cls + '"><div class="node">' + (done === ss.length ? "&#10003;" : i + 1) + '</div><div class="phase-body"><div class="phase-head"><h3>' + esc(ph) + '</h3><span class="phase-count">' + done + " of " + ss.length + " signed off</span></div>" +
      '<ul class="stages">' + ss.map(function (s) { return "<li>" + stageRow(s, st[s.id]) + "</li>"; }).join("") + "</ul></div></section>";
  });
  return h + "</div>";
}
function renderPlate(st, list) {
  var m = myMember(), h = "";

    h += '<div class="block"><h3>Waiting for your sign-off</h3>' + (w.length ? '<ul class="stages">' + w.map(function (s) { return "<li>" + stageRow(s, st[s.id]) + "</li>"; }).join("") + "</ul>" : '<p class="muted">Nothing waiting.</p>') + "</div>";
  }
  if (m) {
    var mine = list.filter(function (s) { return ownersOf(s).indexOf(m.id) >= 0 && !st[s.id].done; });
    var open = mine.filter(function (s) { return !st[s.id].locked; }).sort(function (a, b) { return (a.due || "9") < (b.due || "9") ? -1 : 1; });
    var locked = mine.filter(function (s) { return st[s.id].locked; });

    h += '<div class="block"><h3>Coming up, still locked</h3>' + (locked.length ? '<ul class="stages">' + locked.map(function (s) { return "<li>" + stageRow(s, st[s.id]) + "</li>"; }).join("") + "</ul>" : '<p class="muted">Nothing queued.</p>') + "</div>";

}

var EXT = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp", svg: "image/svg+xml", mp4: "video/mp4", m4v: "video/mp4", webm: "video/webm", pdf: "application/pdf", csv: "text/csv", md: "text/markdown", json: "application/json", txt: "text/plain" };

function whyNot(f) {

  if (["mov", "avi", "mkv", "hevc"].indexOf(e) >= 0) return f.name + ": export it as MP4, or add a Drive link.";
  if (["doc", "docx", "ppt", "pptx", "xls", "xlsx", "key", "pages", "numbers"].indexOf(e) >= 0) return f.name + ": save it as PDF, or add a Drive link.";
  if (["heic", "heif"].indexOf(e) >= 0) return f.name + ": export it as JPG, or add a Drive link.";
  return f.name + ": this file type can't be uploaded. Add a link instead.";
}
function assetErr(e, f) {

  if (c === "rate_limited") return "Too many uploads at once. Wait a moment and try again.";

  if (!myMember()) return '<div class="chat-compose"><div class="chat-col"><span class="hint">Pick your name at the top of the page to join the chat.</span></div></div>';
  return '<div class="chat-compose"><div class="chat-col c-row"><div class="mention-pop" data-pop="' + esc(room) + '"></div><textarea rows="1" placeholder="Message. Type @ to tag someone" data-keep="chat-' + esc(room) + '" data-chat-input="' + esc(room) + '"></textarea><button class="btn btn-primary" data-act="chat-send" data-room="' + esc(room) + '">Send</button></div></div>';
}

  if (!S.ready || S.chatOpen) return "";

}

  if (S.chatFull) {
    h += '<nav class="c-rooms" aria-label="Chat rooms"><div class="c-rooms-head">Rooms</div>' + rooms.map(function (r) {

        '<span class="c-room-last">' + esc(l ? (l.mid ? memberName(l.mid) : who(l.by)) + ": " + l.text : "No messages yet") + "</span></button>";
    }).join("") + "</nav>";

    '<button class="c-icon" data-act="chat-close" aria-label="Close chat" title="Close">&times;</button></div>' + chatBody(room) + chatCompose(room) + "</div></aside>";

/* ---------- edit & delete ---------- */
function deleteProject(pid) {
  var p = S.projects[pid]; if (!p) return;
  var typed = prompt("Delete " + p.name + " permanently? Every stage, sign-off, file, log entry and chat message goes with it.\n\nType the production name to confirm:");
  if (typed === null) return; if (typed.trim() !== p.name) return toast("Not deleted. The name didn't match.");
  if (S.route.v === "project" && S.route.pid === pid) go({ v: "home" });
  function wipe(col) {
    return S.db.collection(col).get().then(function (s) {
      return Promise.all(s.docs.map(function (d) {
        var x = d.data();
        if (x.files && S.assets) Object.keys(x.files).forEach(function (k) { var f = x.files[k]; if (f && f.asset) S.assets.delete(f.asset).catch(function () {}); });
        return S.db.doc(col + "/" + d.id).delete();
      }));
    });
  }
  Promise.all([wipe("projects/" + pid + "/stages"), wipe("projects/" + pid + "/log"), wipe("chat/" + pid + "/msgs"),
    S.db.collection("signoffs").where("pid", "==", pid).get().then(function (s) { return Promise.all(s.docs.map(function (d) { return S.db.doc("signoffs/" + d.id).delete(); })); })
  ]).then(function () { return S.db.doc("projects/" + pid).delete(); })
    .then(function () { delete S.homeStats[pid]; toast(p.name + " deleted."); alertsSoon(); })
    .catch(function (e) { toast(errMsg(e)); });
}

  else put("chat/" + (a.room || "all") + "/msgs/m" + uid(), { at: now, by: S.me.id, mid: me ? me.id : "", text: text, mentions: [] }).catch(function () {});

/* ---------- import from old version ---------- */
A["import-data"] = function () {
  var inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = function () {
    var f = inp.files[0]; if (!f) return;
    f.text().then(function (t) {
      var d = JSON.parse(t), docs = d.docs || {}, paths = Object.keys(docs);
      if (!paths.length) return toast("That file has no data.");
      var np = paths.filter(function (p) { return /^projects\/[^/]+$/.test(p); }).length;
      if (!confirm("Import " + np + " production" + (np === 1 ? "" : "s") + " and " + paths.length + " records? Existing records with the same id are replaced.")) return;
      toast("Importing…");
      paths.sort(function (a, b) { return a.split("/").length - b.split("/").length; });
      var i = 0;
      (function next() {
        var batch = paths.slice(i, i + 20); i += 20;
        if (!batch.length) { toast("Imported " + np + " production" + (np === 1 ? "" : "s") + "."); return; }
        Promise.all(batch.map(function (p) { return S.db.doc(p).set(docs[p]); })).then(next, function () { toast("Import stopped. Try again."); });
      })();
    }).catch(function () { toast("That isn't a pipeline export file."); });
  };
  inp.click();
};


/* ---------- restored data: Cognitive Botics + team (runs once per database) ---------- */
function seedRestore() {
  if (!S.db || !S.canWrite || seedRestore.done) return; seedRestore.done = true;
  S.db.collection("meta").get().then(function (snap) {
    if (snap.docs.some(function (d) { return d.id === "restore-cb"; })) return;
    var team = [["apoorv", "Apoorv", "Creative Director"], ["saksham", "Saksham", "Producer, EP and Ops"], ["swapnil", "Swapnil", "Creative Architect and Writer"],
      ["uthkarsha", "Uthkarsha", "Creative Producer"], ["srestha", "Srestha", "Client POC"], ["meghana", "Meghana", "Project Manager"], ["saahil", "Saahil", "Associate Creative Director"]];
    var jobs = team.map(function (t, i) {
      var ex = S.team[t[0]];
      return ex ? upd("team/" + t[0], { role: t[2], order: i }) : put("team/" + t[0], { id: t[0], name: t[1], role: t[2], email: "", userId: null, order: i });
    });
    var exists = Object.keys(S.projects).some(function (k) { return /cognitive botics/i.test(S.projects[k].name || ""); });
    if (!exists) {
      var pid = "cognitive-botics";
      var p = { id: pid, name: "Cognitive Botics", client: "Cognitive Botics", ppmDate: "2026-09-29", shootDate: "2026-10-01", archived: false, createdAt: Date.now(), createdBy: S.me.id,
        deliverables: [
          { id: "film-one", name: "Film One", type: "film", firstCut: "2026-10-06", finalCut: "2026-10-09" },
          { id: "film-two", name: "Film Two", type: "film", firstCut: "2026-10-09", finalCut: "2026-10-13" },
          { id: "performance-ads", name: "Performance Ads", type: "reel", delivery: "2026-10-06" }
        ] };
      jobs.push(put("projects/" + pid, p).then(function () {
        return Promise.all(buildStages(p, pid).map(function (s) {
          if (s.data.key === "script_lock") s.data.owners = ["saksham", "apoorv", "swapnil"];
          return put(stagePath(pid, s.id), s.data);
        }));
      }).then(function () { logIt(pid, "restored the production from the old version"); }));
    }
    Promise.all(jobs).then(function () { put("meta/restore-cb", { at: Date.now() }); });
  }).catch(function () { seedRestore.done = false; });
}

/* ---------- boot ---------- */
render();
function backend() {
  var c = window.PIPELINE_CONFIG;
  if (c && c.supabaseUrl && !/YOUR-PROJECT|PASTE-YOUR/.test(c.supabaseUrl + c.supabaseAnonKey) && window.PipelineSupabase && window.supabase) {
    var b = window.PipelineSupabase.create(c); return { use: function (k) { return Promise.resolve(b[k]); } };
  }
  if (window.PipelineLocal) { var l = window.PipelineLocal.create(c); S.local = true; return { use: function (k) { return Promise.resolve(l[k]); } }; }
  return null;
}
(function boot() {
  var B = backend();
  if (!B) { S.fatal = "The pipeline isn't connected to a database yet. Add your Supabase URL and key at the top of this HTML file."; return render(); }
  Promise.all([B.use("db"), B.use("user")]).then(function (r) {
    S.db = r[0]; S.user = r[1];
    if (!S.db) { S.fatal = "The pipeline couldn't connect to its data. Check the Supabase keys at the top of this HTML file and reload."; return render(); }
    var ident = S.user ? Promise.all([S.user.me(), S.user.can("data.write")]) : Promise.resolve([{ id: null, name: "", avatarUrl: "", canEdit: false }, null]);
    return ident.then(function (w) {
      S.me = w[0]; S.isAdmin = !!w[0].isOwner; S.canWrite = w[1] !== false;
      B.use("assets").then(function (a) { S.assets = a; render(); });
      ensureChat("all"); var got = { t: false, p: false };
      function ready() { if (got.t && got.p && !S.ready) { S.ready = true; onRoute(); seedRestore(); } else render(); if (S.ready) alertsSoon(); }
      subs.base.push(S.db.collection("team").onSnapshot(function (snap) { var o = {}; snap.docs.forEach(function (d) { o[d.id] = Object.assign({ id: d.id }, d.data()); }); S.team = o; got.t = true; ready(); }, function (e) { toast(errMsg(e)); }));
      subs.base.push(S.db.collection("projects").onSnapshot(function (snap) { var o = {}; snap.docs.forEach(function (d) { o[d.id] = Object.assign({ id: d.id }, d.data()); }); var first = !got.p; S.projects = o; got.p = true; ready(); if (!first && S.route.v === "home") loadHomeStats(); }, function (e) { toast(errMsg(e)); }));
    });
  }).catch(function () { S.fatal = "The pipeline couldn't start. Reload the page."; render(); });
})();
